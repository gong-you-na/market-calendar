name: hourly-live-data
# 매시간: 주요 이슈(뉴스 헤드라인)·주요 인물 발언·비트코인 청산맵을 갱신해 `live` 브랜치에만 올립니다.
# main 에는 커밋하지 않으므로 Netlify 재배포가 일어나지 않고, 페이지는 raw.githubusercontent.com/.../live/data/*.json 을 직접 읽습니다.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: live-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Seed state from live branch (rolling caches, previous items)
        run: |
          git fetch --depth 1 origin live && git checkout origin/live -- data/news.json data/voices.json data/liq.json data/cache/liq_events.json || echo "no live branch yet"
      - name: Run hourly scripts
        run: bash scripts/run_hourly.sh
      - name: Publish to live branch (single orphan commit, no history)
        run: |
          set -e
          mkdir -p /tmp/live/data/cache
          cp data/news.json data/voices.json data/liq.json /tmp/live/data/
          cp data/cache/liq_events.json /tmp/live/data/cache/ 2>/dev/null || true
          cd /tmp/live
          git init -q -b live
          git config user.name wisdomtooth-bot
          git config user.email bot@wisdomtooth.local
          git add -A
          git commit -q -m "live: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:live
